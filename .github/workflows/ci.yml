name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgrs
          POSTGRES_PASSWORD: pgrs
          POSTGRES_DB: pgrs_peedika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgrs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pgrs:pgrs@localhost:5432/pgrs_peedika_test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:4000
      CLOUD_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgrs
          POSTGRES_PASSWORD: pgrs
          POSTGRES_DB: pgrs_peedika_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgrs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pgrs:pgrs@localhost:5432/pgrs_peedika_e2e
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:4000
      SEED_OWNER_EMAIL: owner@pgrspeedika.example
      # E2E specs need the OTP helper endpoint (never enable in production).
      ENABLE_TEST_OTP: "true"
      CLOUD_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @pgrs/web exec playwright install --with-deps chromium

      - name: Apply migrations and seed
        run: |
          pnpm db:migrate
          # Throwaway owner password for the ephemeral CI database; exported
          # for the e2e step via GITHUB_ENV so no credential literal is stored.
          PW="ci-$(date +%s)-owner"
          echo "SEED_OWNER_PASSWORD=$PW" >> "$GITHUB_ENV"
          SEED_OWNER_PASSWORD="$PW" pnpm db:seed

      - name: Build and run E2E
        run: pnpm --filter @pgrs/web test:e2e:ci
